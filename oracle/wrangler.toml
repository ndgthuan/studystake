# StudyStake oracle (Cloudflare Worker).
# Placeholders marked REPLACE_* must be set before deploy. Secrets are NOT stored here:
#   npx wrangler secret put ORACLE_PRIVATE_KEY   (and the others listed in README.md)

name = "studystake-oracle"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "d018877143ce4d699bbca8379dae5cd0"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "studystake-evidence"

[vars]
# Fuji defaults
CHAIN_ID = "43113"
# The official public RPC caps eth_getLogs at 100 blocks, which breaks the 2000-block Joined scan. PublicNode does not.
RPC_URL = "https://avalanche-fuji-c-chain-rpc.publicnode.com"
# REPLACE_* : set after `forge script script/Deploy.s.sol --broadcast --rpc-url <fuji>`
MANAGER_ADDRESS = "0xe642306aBB4bD8BB452B3089aCD84960F88B9786"
DEPLOY_BLOCK = "61216349"
ALLOWED_ORIGINS = "https://studystake-puce.vercel.app,http://localhost:3000"
MOODLE_SITES = "https://courses.ctda.hcmus.edu.vn"
# 0.05 AVAX per eligible new wallet. At the daily cap, budget 1 Fuji AVAX plus gas.
FAUCET_AMOUNT_WEI = "50000000000000000"
FAUCET_DAILY_CAP = "20"
# Paid credential (docs/X402.md). An empty facilitator URL turns the route off. The asset needs EIP-3009, so not tUSDC.
X402_FACILITATOR_URL = "https://facilitator.ultravioletadao.xyz"
# For a team-hosted endpoint, deploy its URL and X402_FACILITATOR_TOKEN together. See docs/DEPLOY_FUJI.md.
X402_ASSET = "0x5425890298aed601595a70AB815c96711a31Bc65"
# 0.005 USDC in base units
X402_PRICE = "5000"

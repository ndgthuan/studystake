<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.fill{transform-box:fill-box;transform-origin:left center;animation:grow 3.2s ease-out infinite alternate}
@keyframes grow{0%{transform:scaleX(.55)}100%{transform:scaleX(1)}}
.card{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.92}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>

<defs>
  <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#1f1f1f"/>
  </pattern>
  <radialGradient id="glow" cx="0.72" cy="0.45" r="0.5">
    <stop offset="0" stop-color="#E84142" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#E84142" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="400" fill="#000000"/>
<rect width="1280" height="400" fill="url(#g)"/>
<rect width="1280" height="400" fill="url(#glow)"/>
<rect x="80" y="112" width="56" height="6" rx="3" fill="#E84142"/>
<text x="80" y="200" font-size="84" font-weight="800" fill="#fafafa" letter-spacing="-2">StudyStake</text>
<text x="80" y="252" font-size="30" fill="#a1a1aa">Stake on a course. Track your work. Verify the result.</text>
<text x="80" y="300" font-size="20" fill="#a1a1aa">Stake USDC on your Moodle deadlines on Avalanche.</text>
<g class="card">
  <rect x="780" y="78" width="420" height="244" rx="20" fill="#111111" stroke="#262626" stroke-width="1.5"/>
  <text x="810" y="126" font-size="20" font-weight="700" fill="#fafafa">CSC10002 · Quiz week 10–12</text>
  <text x="810" y="162" font-size="18" fill="#a1a1aa">Stake 100 USDC</text>
  <text x="810" y="200" font-size="18" fill="#a1a1aa">Progress 2 / 2</text>
  <path d="M1076 186 l6 6 l12 -13" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="810" y="218" width="360" height="12" rx="6" fill="#262626"/>
  <rect class="fill" x="810" y="218" width="360" height="12" rx="6" fill="#22c55e"/>
  <text x="810" y="278" font-size="15" fill="#a1a1aa">Reward</text>
  <text x="1170" y="278" font-size="24" font-weight="800" fill="#22c55e" text-anchor="end">+29.99 USDC</text>
</g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="StudyStake logo">
  <style>
    .glow {
      transform-box: view-box;
      transform-origin: 256px 256px;
      animation: glow 2.8s ease-in-out infinite;
    }
    .coin {
      transform-box: view-box;
      animation: bob 2.8s ease-in-out infinite;
    }
    .spark {
      transform-box: view-box;
      opacity: 0;
      animation: rise 2.8s ease-out infinite;
    }
    .spark.s2 { animation-delay: -1.4s; }
    @keyframes glow {
      0%, 100% { opacity: 0.35; transform: scale(0.92); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(24px); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-56px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow, .coin, .spark { animation: none; }
      .glow { opacity: 0.5; }
      .spark { opacity: 0; }
    }
  </style>

  <defs>
    <radialGradient id="glow_fill" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E84142" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E84142" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A5B"/>
      <stop offset="1" stop-color="#C92E2F"/>
    </linearGradient>
  </defs>

  <!-- badge: pure black with a subtle edge -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="#000000" stroke="#1F1F1F" stroke-width="4"/>

  <circle class="glow" cx="256" cy="256" r="190" fill="url(#glow_fill)"/>

  <g class="coin">
    <circle cx="256" cy="256" r="130" fill="url(#coin_fill)"/>
    <circle cx="256" cy="256" r="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="10 10"/>
    <!-- graduation cap -->
    <polygon points="256,168 352,212 256,256 160,212" fill="#F2F2F2"/>
    <path d="M196 232 V276 Q256 304 316 276 V232 L256 258 Z" fill="#D9D9D9"/>
    <line x1="336" y1="222" x2="336" y2="272" stroke="#F2F2F2" stroke-width="6" stroke-linecap="round"/>
    <circle cx="336" cy="278" r="8" fill="#F2F2F2"/>
  </g>

  <g transform="translate(402 150)">
    <path class="spark" d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z" fill="#FFFFFF"/>
  </g>
  <g transform="translate(108 170)">
    <path class="spark s2" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#FFFFFF"/>
  </g>
</svg>
